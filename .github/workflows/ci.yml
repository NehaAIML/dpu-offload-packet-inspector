name: DPU Inspector CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: python3 cmd/inspector/main.py
    - run: python3 benchmarks/run_benchmarks.py
